[package]
name = "resonators-wasm"
version = "0.1.0"
edition = "2024"
description = "WASM bindings for the resonators crate"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
resonators = { path = "../resonators" }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
